<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UniPilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#171226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UniPilot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#171226; --panel:#1D1730; --panel-2:#221B3A; --card:#271F45; --card-hi:#2E2552;
  --line:rgba(255,255,255,0.09); --line-soft:rgba(255,255,255,0.05);
  --text:#F3EFFB; --text-dim:#B4A9D1; --text-faint:#7C7098;
  --lavender:#9B8AFB; --gold:#F0B84F; --mint:#6FD7B5; --coral:#FF8A73; --sky:#6FB8F0; --pink:#F17FB0; --danger:#FF6B6B;
  --radius:14px; --radius-sm:9px; --shadow:0 10px 30px -12px rgba(0,0,0,0.55);
  --xp:#F0B84F;
}
/* THEME OVERRIDES (seasonal) applied to body via data-theme */
body[data-theme="autumn"]{ --void:#1C130E; --panel:#241811; --panel-2:#2A1B12; --card:#3A2417; --card-hi:#472B1A; --lavender:#E08A3C; --gold:#D9A441; --mint:#8FA85C; --coral:#C1502E; --sky:#B98756; --pink:#E4632F; }
body[data-theme="halloween"]{ --void:#120E1A; --panel:#181025; --panel-2:#1D122C; --card:#241536; --card-hi:#2E1A44; --lavender:#FF8A2B; --gold:#B98CFF; --mint:#7CE383; --coral:#FF5C5C; --sky:#8A6BFF; --pink:#FF4FA3; }
body[data-theme="christmas"]{ --void:#0E1A16; --panel:#12221C; --panel-2:#152B22; --card:#1A3A2C; --card-hi:#1F4633; --lavender:#E24C4C; --gold:#E8C468; --mint:#4FBF8B; --coral:#E24C4C; --sky:#8FD6C4; --pink:#E88BA0; }
body[data-theme="january"]{ --void:#10151F; --panel:#141B27; --panel-2:#17202F; --card:#1C2A3C; --card-hi:#213348; --lavender:#7FA8FF; --gold:#BFD4FF; --mint:#6FD7D0; --coral:#FF9E7F; --sky:#8FC7FF; --pink:#C9A8FF; }
body[data-theme="spring"]{ --void:#141A12; --panel:#182018; --panel-2:#1C271C; --card:#243422; --card-hi:#2B3F28; --lavender:#B3D96A; --gold:#F0D75E; --mint:#7FE0A8; --coral:#FF9EC4; --sky:#8FE3D0; --pink:#FFB6D9; }
body[data-theme="exam"]{ --void:#160F1C; --panel:#1B1224; --panel-2:#20152B; --card:#291A38; --card-hi:#312044; --lavender:#B98CFF; --gold:#FF7E7E; --mint:#6FD7B5; --coral:#FF6B6B; --sky:#8CAFFF; --pink:#FF7EBF; }
body[data-theme="summer"]{ --void:#0F1B1E; --panel:#122428; --panel-2:#152B30; --card:#1B3A3F; --card-hi:#20464C; --lavender:#5EE0D0; --gold:#FFD166; --mint:#6FE0A0; --coral:#FF8A5C; --sky:#5EC8F0; --pink:#FF6FA0; }
body[data-theme="firstweek"]{ --void:#141329; --panel:#191835; --panel-2:#1E1C3F; --card:#282454; --card-hi:#312B66; --lavender:#8A7BFF; --gold:#FFC85E; --mint:#5EE0C0; --coral:#FF6F9E; --sky:#5EB8FF; --pink:#FF6FE0; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--lavender) 10%, transparent), transparent 45%),
    radial-gradient(circle at 90% 85%, color-mix(in srgb, var(--mint) 8%, transparent), transparent 40%),
    var(--void);
  color:var(--text); font-family:'Manrope',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .4s ease;
}
::selection{background:var(--lavender);color:#171226;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3a3160;border-radius:10px;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}

#app{display:flex;min-height:100vh;}
#sidebar{
  width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border-right:1px solid var(--line); display:flex;flex-direction:column;padding:20px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px 8px;margin-bottom:10px;border-bottom:1px solid var(--line-soft);}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--lavender),var(--sky));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:#171226;transform:rotate(-4deg);box-shadow:0 4px 14px -4px color-mix(in srgb, var(--lavender) 60%, transparent);}
.brand-text{font-family:'Fraunces',serif;font-weight:600;font-size:18px;}
.brand-sub{font-size:10px;color:var(--text-faint);margin-top:-2px;letter-spacing:.5px;text-transform:uppercase;}

.mode-switch{display:flex;background:var(--card);border-radius:11px;padding:3px;margin-bottom:14px;}
.mode-switch button{flex:1;border:none;background:none;color:var(--text-dim);padding:8px 6px;border-radius:8px;font-size:11.5px;font-weight:800;cursor:pointer;letter-spacing:.2px;}
.mode-switch button.active{background:var(--lavender);color:#171226;}

.xp-box{background:var(--card);border-radius:11px;padding:10px 12px;margin-bottom:14px;}
.xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.xp-level{font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--gold);}
.xp-num{font-size:10px;color:var(--text-faint);}
.xp-track{height:6px;border-radius:4px;background:var(--panel);overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:4px;transition:width .4s;}

nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-btn{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;border:none;background:none;color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;transition:background .15s,color .15s;}
.nav-btn .ic{width:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-btn:hover{background:var(--card);color:var(--text);}
.nav-btn.active{background:var(--card-hi);color:var(--text);box-shadow:inset 2px 0 0 var(--lavender);}
.nav-group-label{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);margin:13px 10px 4px;font-weight:700;}

.sidebar-foot{padding-top:10px;border-top:1px solid var(--line-soft);margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.cat-btn{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:8px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;}
.cat-btn:hover{border-color:var(--lavender);color:var(--text);}
select.theme-select{font-size:11.5px;padding:7px 8px;}

#main{flex:1;min-width:0;padding:30px 38px 60px;max-width:1180px;}
.page{display:none;} .page.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:28px;font-weight:600;margin:0;}
.page-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--lavender);font-weight:700;margin:0 0 4px;}
.page-desc{color:var(--text-dim);font-size:13.5px;margin-top:4px;max-width:560px;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;}
.btn:hover{background:var(--card-hi);border-color:var(--lavender);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--lavender),color-mix(in srgb, var(--lavender) 70%, #4A3FD1));border-color:transparent;color:#14102A;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:none;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--card);color:var(--text);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
.btn-danger{color:var(--danger);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.empty{text-align:center;padding:38px 20px;color:var(--text-faint);border:1.5px dashed var(--line);border-radius:var(--radius);font-size:13.5px;}
.empty b{color:var(--text-dim);display:block;font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:4px;}

.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:100px;font-size:11.5px;font-weight:700;background:var(--card);white-space:nowrap;}
.tag .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{
  background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:9px;font-size:13.5px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--lavender);}
label{font-size:11.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px;}
.field{margin-bottom:13px;} .field-row{display:flex;gap:10px;} .field-row>.field{flex:1;}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(10,7,20,0.65);backdrop-filter:blur(3px);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);}
.modal.wide{max-width:600px;}
.modal h3{margin:0 0 16px;font-size:19px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.swatch{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:#fff;}

.cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.view-toggle{display:flex;background:var(--card);border-radius:10px;padding:3px;}
.view-toggle button{border:none;background:none;color:var(--text-dim);padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
.view-toggle button.active{background:var(--lavender);color:#171226;}
.cal-nav{display:flex;align-items:center;gap:8px;margin-left:auto;}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--lavender);}
.cal-month-label{font-family:'Fraunces',serif;font-size:16px;font-weight:600;min-width:150px;text-align:center;}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.month-dow{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);font-weight:700;padding-bottom:4px;}
.month-cell{min-height:88px;border-radius:10px;border:1px solid var(--line-soft);background:var(--panel);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s;}
.month-cell:hover{border-color:var(--lavender);background:var(--card);}
.month-cell.other{opacity:0.35;}
.month-cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.month-cell .daynum{font-size:12px;font-weight:700;color:var(--text-dim);}
.month-cell.today .daynum{color:var(--gold);}
.mini-chip{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;color:#171226;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.week-grid{display:grid;grid-template-columns:52px repeat(7,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.week-head{padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);background:var(--panel);border-bottom:1px solid var(--line);}
.week-head .d{color:var(--text-faint);font-weight:500;font-size:9.5px;text-transform:uppercase;}
.week-timecol{background:var(--panel);}
.hour-label{height:52px;font-size:9.5px;color:var(--text-faint);text-align:right;padding-right:6px;border-top:1px solid var(--line-soft);transform:translateY(-6px);}
.daycol{position:relative;background:var(--void);border-left:1px solid var(--line-soft);}
.hourline{position:absolute;left:0;right:0;height:1px;background:var(--line-soft);}
.evt-block{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 6px;overflow:hidden;font-size:10.5px;font-weight:700;color:#171226;cursor:pointer;box-shadow:0 3px 8px -3px rgba(0,0,0,.5);}
.evt-block small{display:block;font-weight:600;font-size:9px;opacity:.8;}
.daycol.today-col{background:color-mix(in srgb, var(--gold) 5%, transparent);}

.day-list{display:flex;flex-direction:column;gap:8px;}
.day-item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:10px;padding:10px 12px;}
.day-item .time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);min-width:44px;}

.list-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:11px;padding:11px 13px;margin-bottom:8px;border:1px solid transparent;}
.list-item:hover{border-color:var(--line);}
.checkbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--text-faint);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.checkbox.done{background:var(--mint);border-color:var(--mint);}
.checkbox.done::after{content:'✓';color:#171226;font-size:12px;font-weight:900;}
.item-text{flex:1;font-size:14px;}
.item-text.done{text-decoration:line-through;color:var(--text-faint);}
.item-meta{font-size:11px;color:var(--text-faint);}
.item-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.list-item:hover .item-actions{opacity:1;}
.icon-x{width:26px;height:26px;border-radius:7px;border:none;background:none;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-x:hover{background:var(--panel-2);color:var(--text);}

.assign-card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;}
.assign-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.assign-title{font-weight:700;font-size:14.5px;}
.assign-mod{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.status-pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap;}
.status-notstarted{background:rgba(255,107,107,.18);color:#FF9C9C;}
.status-inprogress{background:rgba(240,184,79,.18);color:var(--gold);}
.status-done{background:rgba(111,215,181,.18);color:var(--mint);}
.assign-due{font-size:11.5px;color:var(--text-faint);margin-top:8px;display:flex;gap:14px;}

.note-card{background:var(--card);border-radius:12px;padding:14px;min-height:110px;display:flex;flex-direction:column;position:relative;}
.note-text{flex:1;font-size:13.5px;white-space:pre-wrap;color:var(--text);}
.note-foot{display:flex;justify-content:flex-end;margin-top:8px;}

.link-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:11px;padding:12px 14px;margin-bottom:8px;}
.link-favi{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#171226;}
.link-title{font-weight:700;font-size:13.5px;}
.link-url{font-size:11px;color:var(--text-faint);}

.budget-hero{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.stat-card{flex:1;min-width:150px;background:var(--card);border-radius:13px;padding:16px;}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);font-weight:700;}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;margin-top:6px;}
.bar-track{height:9px;border-radius:6px;background:var(--panel);overflow:hidden;margin-top:8px;}
.bar-fill{height:100%;border-radius:6px;}
.expense-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;padding:10px 13px;margin-bottom:7px;}
.expense-cat{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.expense-amt{font-family:'JetBrains Mono',monospace;font-weight:600;margin-left:auto;}

#whiteboard-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#F3EFFB;}
#wb-toolbar{background:var(--panel);padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap;}
#wb-canvas{display:block;cursor:crosshair;touch-action:none;width:100%;}
.wb-color{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.wb-color.sel{border-color:#fff;transform:scale(1.15);}

.timer-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 0;}
.timer-ring{position:relative;width:230px;height:230px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-time{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:600;}
.timer-mode{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-faint);margin-top:4px;font-weight:700;}
.timer-controls{display:flex;gap:10px;margin-top:26px;}
.timer-sessions{margin-top:20px;display:flex;gap:6px;}
.sess-dot{width:9px;height:9px;border-radius:50%;background:var(--card);}
.sess-dot.filled{background:var(--gold);}

.dash-widget h3{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.dash-empty{font-size:12.5px;color:var(--text-faint);padding:8px 0;}
.section-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.sub-tab{padding:7px 14px;border-radius:9px;background:var(--card);border:1px solid transparent;color:var(--text-dim);font-size:12.5px;font-weight:700;cursor:pointer;}
.sub-tab.active{background:var(--card-hi);color:var(--text);border-color:var(--lavender);}

/* ===== BEYOND UNI specific ===== */
.beyond-hero{background:linear-gradient(135deg, color-mix(in srgb, var(--lavender) 16%, var(--panel)), var(--panel));border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.level-badge{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--coral));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#171226;font-family:'Fraunces',serif;font-weight:800;flex-shrink:0;transform:rotate(-3deg);box-shadow:0 8px 20px -8px color-mix(in srgb, var(--gold) 70%, transparent);}
.level-badge .lv{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.75;}
.level-badge .num{font-size:22px;line-height:1;}

.quest-card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
.quest-xp{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--gold);background:color-mix(in srgb, var(--gold) 14%, transparent);padding:3px 9px;border-radius:100px;white-space:nowrap;}

.place-card{background:var(--card);border-radius:13px;padding:15px;position:relative;}
.place-cat-tag{position:absolute;top:12px;right:12px;}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
.visited-badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mint);}

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-app-compat.min.js"></script>

<script>
/* =========================================================
   STORAGE — pure localStorage, works fully offline, no Claude needed
========================================================= */
const NS = 'unipilot:';

/* ---- keys that should NEVER be pushed to the cloud (too large / not worth syncing) ---- */
const NO_SYNC_KEYS = ['whiteboard'];

function save(key, val){
  try{ localStorage.setItem(NS+key, JSON.stringify(val)); }catch(e){ console.error('save failed', key, e); }
  if(!NO_SYNC_KEYS.includes(key)) pushToCloud(key, val);
}
function load(key, fallback){ try{ const raw = localStorage.getItem(NS+key); return raw===null ? fallback : JSON.parse(raw); }catch(e){ return fallback; } }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

/* =========================================================
   CLOUD SYNC (Firebase) — entirely optional.
   Fill in firebaseConfig below with your own project's keys to enable
   sign-in and automatic cross-device sync. Until you do, the app works
   exactly as before: local-only, saved just to this browser.
   See the setup guide that came with this file for exact steps.
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBgkm8AZmROxFbfOyffB5NT1-HiVM2_8ng",
  authDomain: "unipilot-1c48c.firebaseapp.com",
  projectId: "unipilot-1c48c",
  storageBucket: "unipilot-1c48c.firebasestorage.app",
  messagingSenderId: "520818396417",
  appId: "1:520818396417:web:d037710c6238a48bc25f00",
  measurementId: "G-QHLE9JV28W"
};
function cloudConfigured(){ return firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_'); }

let fbAuth = null, fbDb = null, cloudUser = null, unsubscribeSnapshot = null, firstSnapshotSeen = false;

if (cloudConfigured() && typeof firebase !== 'undefined') {
  try {
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAuth.onAuthStateChanged(handleAuthChange);
  } catch(e){ console.error('Firebase init failed', e); }
}

let lastSyncedAt = null;
function updateLastSynced(){
  lastSyncedAt = new Date();
  const el = document.getElementById('lastSynced');
  if(el) el.textContent = 'Last synced ' + lastSyncedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function manualRefresh(){
  if(!cloudUser || !fbDb){ showToast('Not signed in'); return; }
  fbDb.collection('users').doc(cloudUser.uid).get().then((doc)=>{
    if(doc.exists){
      const cloudData = doc.data();
      Object.keys(cloudData).forEach(k=>{
        if(NO_SYNC_KEYS.includes(k)) return;
        state[k] = cloudData[k];
        try{ localStorage.setItem(NS+k, JSON.stringify(cloudData[k])); }catch(e){}
      });
      renderXpBox(); renderPage(); updateLastSynced();
      showToast('Refreshed from cloud');
    }
  }).catch(e=>{ console.error(e); showToast('Refresh failed — check your connection'); });
}
function handleAuthChange(user){
  cloudUser = user;
  renderSyncStatus();
  updateAuthGate();
  if(user){ attachCloudListener(user.uid); }
  else { detachCloudListener(); }
}
function updateAuthGate(){
  const gate = document.getElementById('authGate');
  const app = document.getElementById('app');
  if(!gate || !app) return;
  if(cloudConfigured() && !cloudUser){
    gate.style.display = 'flex';
    app.style.visibility = 'hidden';
  } else {
    gate.style.display = 'none';
    app.style.visibility = 'visible';
  }
}
function attachCloudListener(userId){
  firstSnapshotSeen = false;
  unsubscribeSnapshot = fbDb.collection('users').doc(userId).onSnapshot((doc)=>{
    if(doc.exists){
      const cloudData = doc.data();
      Object.keys(cloudData).forEach(k=>{
        if(NO_SYNC_KEYS.includes(k)) return;
        state[k] = cloudData[k];
        try{ localStorage.setItem(NS+k, JSON.stringify(cloudData[k])); }catch(e){}
      });
      renderXpBox(); renderPage();
      updateLastSynced();
      if(!firstSnapshotSeen) showToast('Synced with your account');
    } else if(!firstSnapshotSeen){
      pushFullStateToCloud(userId);
    }
    firstSnapshotSeen = true;
  }, (err)=>{ console.error('Sync error', err); showToast('Sync error — check Firestore rules'); });
}
function detachCloudListener(){ if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; } }
function pushFullStateToCloud(userId){
  const payload = {};
  Object.keys(state).forEach(k=>{ if(!NO_SYNC_KEYS.includes(k)) payload[k] = state[k]; });
  fbDb.collection('users').doc(userId).set(payload).then(()=> showToast("This device's data is now backed up to your account"))
    .catch(e=> console.error('initial cloud push failed', e));
}
function pushToCloud(key, val){
  if(!cloudUser || !fbDb) return;
  fbDb.collection('users').doc(cloudUser.uid).set({[key]: val}, {merge:true}).catch(e=> console.error('cloud save failed', key, e));
}
function cloudSignIn(){
  if(!cloudConfigured()){ showToast("Cloud sync isn't set up yet — see the setup guide"); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e=>{
    showToast('Sign-in failed: '+e.message);
    const err = document.getElementById('authGateError');
    if(err) err.textContent = e.message;
  });
}
function cloudSignOut(){ if(fbAuth) fbAuth.signOut(); }
function renderSyncStatus(){
  const el = document.getElementById('syncStatus');
  const refreshBtn = document.getElementById('refreshBtn');
  if(!el) return;
  if(!cloudConfigured()){ el.textContent = '☁ Cloud sync not set up'; el.onclick = ()=> showToast('See the setup guide to turn this on'); if(refreshBtn) refreshBtn.style.display='none'; return; }
  if(cloudUser){
    el.textContent = `☁ Synced — ${cloudUser.email}`;
    el.onclick = ()=>{ if(confirm('Sign out? You will need to sign in again to use UniPilot.')) cloudSignOut(); };
    if(refreshBtn) refreshBtn.style.display = 'flex';
  } else {
    el.textContent = '☁ Sign in required'; el.onclick = cloudSignIn;
    if(refreshBtn) refreshBtn.style.display = 'none';
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.style.display='none', 2400);
}

/* =========================================================
   STATE — Uni Core (unchanged data model) + Beyond Uni (new, fully separate)
========================================================= */
let state = {
  // --- CORE ---
  categories: [], events: [], timetable: [], todos: [], reminders: [],
  assignments: [], revisionResources: [], revisionSlots: [], notes: [], links: [],
  budget: {loan:0, expenses:[]}, timerSettings: {work:25, short:5, long:15, sessions:4},
  // --- BEYOND ---
  places: [],          // uni life map: {id,name,category,notes,rating,visited}
  studyGenHistory: [],
  opportunities: [],   // extracurricular & career: {id,title,type,deadline,status,notes}
  bugs: [],            // {id,title,project,cause,fix,lesson,date}
  projects: [],        // {id,name,desc,tech,skills,github,challenges,learned,future,portfolio}
  quests: [],          // {id,text,xp,done,weekOf}
  xp: 0,
  theme: 'auto'
};
const DEFAULT_CATS = [
  {id:'c1',name:'Lectures',color:'#6FB8F0'},{id:'c2',name:'Assignments',color:'#FF8A73'},
  {id:'c3',name:'Personal',color:'#6FD7B5'},{id:'c4',name:'Societies',color:'#9B8AFB'},
  {id:'c5',name:'Deadlines',color:'#F0B84F'},{id:'c6',name:'Revision',color:'#F17FB0'}
];
const PALETTE = ['#6FB8F0','#FF8A73','#6FD7B5','#9B8AFB','#F0B84F','#F17FB0','#8FE3A8','#FF9EC4','#7CC7E8','#D9A5FF'];
const PLACE_CATS = [{k:'study',n:'Study space',c:'#6FB8F0'},{k:'library',n:'Library',c:'#9B8AFB'},{k:'cafe',n:'Café',c:'#F0B84F'},{k:'food',n:'Restaurant',c:'#FF8A73'},{k:'shop',n:'Shop',c:'#6FD7B5'},{k:'supermarket',n:'Supermarket',c:'#F17FB0'},{k:'society',n:'Society spot',c:'#8FE3A8'},{k:'event',n:'Event venue',c:'#D9A5FF'},{k:'other',n:'Other',c:'#7CC7E8'}];
const OPPO_TYPES = ['Society','University event','Hackathon','Competition','Workshop','Volunteering','Networking event','Careers event','Internship','Placement','Other'];
const OPPO_STATUS = [{k:'interested',n:'Interested',c:'#7C7098'},{k:'applied',n:'Applied',c:'#F0B84F'},{k:'interview',n:'Interview stage',c:'#6FB8F0'},{k:'accepted',n:'Accepted',c:'#6FD7B5'},{k:'rejected',n:'Rejected',c:'#FF6B6B'},{k:'completed',n:'Completed',c:'#9B8AFB'}];
const THEMES = [
  {k:'auto',n:'Auto (by date)'},{k:'firstweek',n:'First week'},{k:'autumn',n:'Autumn'},{k:'halloween',n:'Halloween'},
  {k:'christmas',n:'Christmas'},{k:'january',n:'January reset'},{k:'spring',n:'Spring'},{k:'exam',n:'Exam season'},{k:'summer',n:'Summer'}
];
function catById(id){ return state.categories.find(c=>c.id===id); }
function catColor(id){ const c = catById(id); return c ? c.color : '#7C7098'; }
function catName(id){ const c = catById(id); return c ? c.name : 'Uncategorised'; }
function placeCat(k){ return PLACE_CATS.find(p=>p.k===k) || PLACE_CATS[PLACE_CATS.length-1]; }
function oppoStatus(k){ return OPPO_STATUS.find(s=>s.k===k) || OPPO_STATUS[0]; }

/* =========================================================
   BOOTSTRAP
========================================================= */
function loadAll(){
  state.categories = load('categories', DEFAULT_CATS);
  state.events = load('events', []);
  state.timetable = load('timetable', []);
  state.todos = load('todos', []);
  state.reminders = load('reminders', []);
  state.assignments = load('assignments', []);
  state.revisionResources = load('revisionResources', []);
  state.revisionSlots = load('revisionSlots', []);
  state.notes = load('notes', []);
  state.links = load('links', []);
  state.budget = load('budget', {loan:0, expenses:[]});
  state.timerSettings = load('timerSettings', {work:25, short:5, long:15, sessions:4});
  state.places = load('places', []);
  state.opportunities = load('opportunities', []);
  state.bugs = load('bugs', []);
  state.projects = load('projects', []);
  state.quests = load('quests', []);
  state.xp = load('xp', 0);
  state.theme = load('theme', 'auto');
}

/* =========================================================
   XP / LEVEL SYSTEM
========================================================= */
function levelFromXp(xp){
  // level thresholds grow: 100, 250, 450, 700 ... (100 * n(n+1)/2 roughly)
  let level = 1, needed = 100, total = 0;
  while(xp >= total+needed){ total += needed; level++; needed = 100 + (level-1)*50; }
  return {level, into: xp-total, needed};
}
async function addXp(amount, reason){
  state.xp += amount;
  save('xp', state.xp);
  showToast(`+${amount} XP · ${reason}`);
  renderXpBox();
}
function renderXpBox(){
  const box = document.getElementById('xpBox');
  const {level, into, needed} = levelFromXp(state.xp);
  box.innerHTML = `
    <div class="xp-top"><span class="xp-level">Level ${level}</span><span class="xp-num mono">${into}/${needed} XP</span></div>
    <div class="xp-track"><div class="xp-fill" style="width:${Math.min(100,(into/needed)*100)}%"></div></div>
  `;
}

/* =========================================================
   SEASONAL THEME
========================================================= */
function autoThemeForDate(){
  const m = new Date().getMonth()+1, d = new Date().getDate();
  if(m===9 && d<=7) return 'firstweek';
  if(m===9 || m===10 && d<20) return 'autumn';
  if(m===10 && d>=20) return 'halloween';
  if(m===11) return 'autumn';
  if(m===12) return 'christmas';
  if(m===1) return 'january';
  if(m===2 || m===3) return 'spring';
  if(m===4 && d<20) return 'spring';
  if((m===4 && d>=20) || m===5) return 'exam';
  if(m===6 || m===7 || m===8) return 'summer';
  return 'autumn';
}
function applyTheme(){
  const t = state.theme==='auto' ? autoThemeForDate() : state.theme;
  document.body.setAttribute('data-theme', t);
}

/* =========================================================
   MODE + NAV
========================================================= */
let currentMode = load('mode', 'core');
let currentPage = currentMode==='core' ? 'dashboard' : 'beyondHome';

const CORE_SECTIONS = [
  {group:'Overview', items:[{id:'dashboard', label:'Dashboard', icon:'◆'}]},
  {group:'Schedule', items:[{id:'calendar', label:'Calendar', icon:'▦'},{id:'timetable', label:'Timetable', icon:'▤'}]},
  {group:'Tasks', items:[{id:'todo', label:'To-Do List', icon:'☑'},{id:'reminders', label:'Reminders', icon:'⏰'},{id:'assignments', label:'Assignments', icon:'✎'},{id:'revision', label:'Revision', icon:'▧'}]},
  {group:'Capture', items:[{id:'whiteboard', label:'Whiteboard', icon:'✦'},{id:'notes', label:'Quick Notes', icon:'▮'},{id:'links', label:'Quick Links', icon:'⛓'}]},
  {group:'Life', items:[{id:'budget', label:'Budget', icon:'£'},{id:'timer', label:'Study Timer', icon:'◷'}]},
];
const BEYOND_SECTIONS = [
  {group:'Overview', items:[{id:'beyondHome', label:'Home & Quests', icon:'✺'}]},
  {group:'Explore', items:[{id:'lifemap', label:'Uni Life Map', icon:'⚑'},{id:'studygen', label:'Study Generator', icon:'⟳'}]},
  {group:'Career', items:[{id:'opportunities', label:'Extracurricular & Career', icon:'✎'},{id:'projects', label:'Projects', icon:'▢'},{id:'bugs', label:'Bug Graveyard', icon:'☠'}]},
  {group:'Showcase', items:[{id:'portfolio', label:'Portfolio Builder', icon:'◈'}]},
];

function renderNav(){
  document.getElementById('modeBtnCore').classList.toggle('active', currentMode==='core');
  document.getElementById('modeBtnBeyond').classList.toggle('active', currentMode==='beyond');
  const sections = currentMode==='core' ? CORE_SECTIONS : BEYOND_SECTIONS;
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  sections.forEach(group=>{
    const label = document.createElement('div');
    label.className = 'nav-group-label'; label.textContent = group.group;
    nav.appendChild(label);
    group.items.forEach(item=>{
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (item.id===currentPage ? ' active':'');
      btn.innerHTML = `<span class="ic">${item.icon}</span> ${item.label}`;
      btn.onclick = ()=>{ currentPage = item.id; renderNav(); renderPage(); document.getElementById('sidebar').classList.remove('open'); };
      nav.appendChild(btn);
    });
  });
}
document.getElementById('modeBtnCore').onclick = ()=>{ currentMode='core'; save('mode','core'); currentPage='dashboard'; renderNav(); renderPage(); };
document.getElementById('modeBtnBeyond').onclick = ()=>{ currentMode='beyond'; save('mode','beyond'); currentPage='beyondHome'; renderNav(); renderPage(); };

const renderers = {};
function renderPage(){
  const pages = document.getElementById('pages');
  pages.innerHTML = '<div class="page active" id="pageRoot"></div>';
  const root = document.getElementById('pageRoot');
  if(renderers[currentPage]) renderers[currentPage](root);
}

/* =========================================================
   MODAL SYSTEM
========================================================= */
function openModal(html, wide){
  document.getElementById('modalBody').className = 'modal' + (wide?' wide':'');
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
function categorySelectHTML(selectedId, id){
  return `<select id="${id}"><option value="">No category</option>${state.categories.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${c.name}</option>`).join('')}</select>`;
}

   CATEGORY MANAGER
========================================================= */
document.getElementById('openCategoryManager').onclick = ()=> renderCategoryManager();
function renderCategoryManager(){
  openModal(`
    <h3>Colour code</h3>
    <p style="color:var(--text-dim);font-size:12.5px;margin-top:-10px;">Used across your calendar, timetable, to-dos and assignments.</p>
    <div id="catList" style="margin:14px 0;"></div>
    <div class="field"><label>New category</label>

  `);

function renderCatList(){
  const el = document.getElementById('catList'); if(!el) return;
  el.innerHTML = state.categories.map(c=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <input type="color" value="${c.color}" onchange="updateCatColor('${c.id}', this.value)" style="width:30px;height:30px;padding:0;border:none;border-radius:8px;background:none;cursor:pointer;">
      <input type="text" value="${c.name}" onchange="updateCatName('${c.id}', this.value)" style="flex:1;">
      <button class="icon-x" onclick="deleteCategory('${c.id}')">✕</button>

/* =========================================================
   UTIL
========================================================= */
function isoDate(d){
  // Build the date string from LOCAL date parts, not UTC — toISOString() converts to UTC
  // which shifts the date by a day for anyone in a UTC+ timezone (e.g. UK in BST).
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoDate(new Date()); }
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ const h=Math.floor(m/60), mm=m%60; return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function fmtMoney(n){ return '£'+(Math.round(n*100)/100).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2}); }
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function startOfWeek(d){ const nd=new Date(d); const day=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-day); nd.setHours(0,0,0,0); return nd; }

let calView = 'month'; let calDate = new Date();
renderers.calendar = function(root){
  root.innerHTML = `
    <div class="page-head"><div><p class="page-eyebrow">Schedule</p><h1 class="page-title">Calendar</h1></div><button class="btn btn-primary" onclick="openEventModal()">+ Add event</button></div>
    <div class="cal-toolbar">
      <div class="view-toggle"><button data-v="month" class="${calView==='month'?'active':''}">Month</button><button data-v="week" class="${calView==='week'?'active':''}">Week</button><button data-v="day" class="${calView==='day'?'active':''}">Day</button></div>
      <div class="cal-nav"><button class="icon-btn" id="calPrev">‹</button><div class="cal-month-label" id="calLabel"></div><button class="icon-btn" id="calNext">›</button><button class="btn btn-sm" id="calToday">Today</button></div>
    </div>
    <div id="calBody"></div>`;
  root.querySelectorAll('.view-toggle button').forEach(b=> b.onclick = ()=>{ calView=b.dataset.v; renderers.calendar(root); });
  document.getElementById('calPrev').onclick = ()=> shiftCal(-1);
  document.getElementById('calNext').onclick = ()=> shiftCal(1);
  document.getElementById('calToday').onclick = ()=>{ calDate=new Date(); renderers.calendar(root); };
  renderCalBody();
};
function shiftCal(dir){ if(calView==='month') calDate.setMonth(calDate.getMonth()+dir); else if(calView==='week') calDate.setDate(calDate.getDate()+dir*7); else calDate.setDate(calDate.getDate()+dir); renderCalBody(); }
function renderCalBody(){
  const label = document.getElementById('calLabel'); const body = document.getElementById('calBody');
  if(calView==='month'){ label.textContent = calDate.toLocaleDateString('en-GB',{month:'long', year:'numeric'}); body.innerHTML = monthGridHTML(); }
  else if(calView==='week'){ const start=startOfWeek(calDate); const end=new Date(start); end.setDate(end.getDate()+6); label.textContent = `${start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`; body.innerHTML = weekGridHTML(start, state.events, 'openEventModal', 'date'); }
  else { label.textContent = calDate.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'}); body.innerHTML = dayListHTML(calDate); }
}
function monthGridHTML(){
  const year=calDate.getFullYear(), month=calDate.getMonth(); const first=new Date(year,month,1);
  const startOffset=(first.getDay()+6)%7; const gridStart=new Date(first); gridStart.setDate(gridStart.getDate()-startOffset);
  const todayIso = todayISO(); let html='<div class="month-grid">';
  DOW.forEach(d=> html+=`<div class="month-dow">${d}</div>`);
  for(let i=0;i<42;i++){
    const cellDate=new Date(gridStart); cellDate.setDate(gridStart.getDate()+i); const iso=isoDate(cellDate);
    const isOther=cellDate.getMonth()!==month; const isToday=iso===todayIso; const dayEvents=state.events.filter(e=>e.date===iso);
    html += `<div class="month-cell ${isOther?'other':''} ${isToday?'today':''}" onclick="openDayFromMonth('${iso}')">
      <div class="daynum">${cellDate.getDate()}</div>
      ${dayEvents.slice(0,3).map(e=>`<div class="mini-chip" style="background:${catColor(e.catId)}">${e.title}</div>`).join('')}
      ${dayEvents.length>3?`<div style="font-size:9.5px;color:var(--text-faint);">+${dayEvents.length-3} more</div>`:''}
    </div>`;
  }
  html += '</div>'; return html;
}
function openDayFromMonth(iso){ calDate = new Date(iso+'T00:00:00'); calView='day'; renderPage(); }
function weekGridHTML(startDate, items, addFnName, dateField){
  const HOURSTART=8, HOUREND=22; const totalH=HOUREND-HOURSTART;
  let html = `<div class="week-grid"><div class="week-timecol"><div class="week-head">&nbsp;</div>`;
  for(let h=HOURSTART;h<HOUREND;h++){ html += `<div class="hour-label">${h}:00</div>`; }
  html += `</div>`;
  const todayIso = todayISO();
  for(let d=0; d<7; d++){
    const colDate = new Date(startDate); colDate.setDate(colDate.getDate()+d); const iso = isoDate(colDate); const isToday = iso===todayIso;
    html += `<div><div class="week-head">${DOW[d]}<div class="d">${colDate.getDate()}</div></div><div class="daycol ${isToday?'today-col':''}" style="height:${totalH*52}px;" data-date="${iso}" data-day="${d}">`;
    for(let h=0;h<=totalH;h++){ html += `<div class="hourline" style="top:${h*52}px;"></div>`; }
    const dayItems = items.filter(it => dateField==='date' ? it.date===iso : it.day===d);
    dayItems.forEach(it=>{
      const startM=timeToMin(it.start)-HOURSTART*60; const endM=timeToMin(it.end||minToTime(timeToMin(it.start)+60))-HOURSTART*60;
      const top=Math.max(0,(startM/60)*52); const height=Math.max(20, ((endM-startM)/60)*52 - 2);
      html += `<div class="evt-block" style="top:${top}px;height:${height}px;background:${catColor(it.catId)}" onclick="${addFnName}('${it.id}')">${it.title||it.module}<small>${it.start}${it.location?' · '+it.location:''}</small></div>`;
    });
    html += `</div></div>`;
  }
  html += `</div>`;
  setTimeout(()=>{
    document.querySelectorAll('.daycol').forEach(col=>{
      col.addEventListener('click', (e)=>{
        if(e.target.classList.contains('evt-block')) return;
        const rect = col.getBoundingClientRect(); const y = e.clientY - rect.top;
        const minutes = HOURSTART*60 + Math.round((y/52)*60/15)*15;
        if(dateField==='date') window.openEventModal(null, col.dataset.date, minToTime(minutes));
        else window.openClassModal(null, parseInt(col.dataset.day), minToTime(minutes));
      });
    });
  },0);
  return html;
}
function dayListHTML(date){
  const iso=isoDate(date); const dow=(date.getDay()+6)%7;
  const dayEvents = state.events.filter(e=>e.date===iso).sort((a,b)=>timeToMin(a.start)-timeToMin(b.start));
  const dayClasses = state.timetable.filter(t=>t.day===dow).sort((a,b)=>timeToMin(a.start)-timeToMin(b.start));
  let html = '<div class="grid grid-2">';
  html += `<div><h3 style="font-size:14px;">Classes</h3><div class="day-list">`;
  html += dayClasses.length ? dayClasses.map(t=>`<div class="day-item" onclick="openClassModal('${t.id}')"><span class="time mono">${t.start}</span><span class="tag"><span class="dot" style="background:${catColor(t.catId)}"></span>${t.module}${t.location?' · '+t.location:''}</span></div>`).join('') : '<div class="empty">No classes.</div>';
  html += `</div></div><div><h3 style="font-size:14px;">Events</h3><div class="day-list">`;
  html += dayEvents.length ? dayEvents.map(e=>`<div class="day-item" onclick="openEventModal('${e.id}')"><span class="time mono">${e.start||'—'}</span><span class="tag"><span class="dot" style="background:${catColor(e.catId)}"></span>${e.title}</span></div>`).join('') : '<div class="empty">No events. Click below to add one.</div>';
  html += `<button class="btn btn-sm" style="margin-top:8px;" onclick="openEventModal(null,'${iso}')">+ Add event</button></div></div></div>`;
  return html;
}

let wbCtx, wbDrawing=false, wbColor='#171226', wbSize=4, wbLast=null;
renderers.whiteboard = function(root){
  root.innerHTML = `<div class="page-head"><div><p class="page-eyebrow">Capture</p><h1 class="page-title">Whiteboard</h1></div></div>
    <div id="whiteboard-wrap"><div id="wb-toolbar">
      ${['#171226','#9B8AFB','#FF8A73','#6FD7B5','#F0B84F','#F17FB0','#6FB8F0'].map(c=>`<div class="wb-color ${c===wbColor?'sel':''}" style="background:${c}" onclick="setWbColor('${c}')"></div>`).join('')}
      <input type="range" min="1" max="16" value="${wbSize}" oninput="wbSize=this.value" style="width:90px;"><button class="btn btn-sm" onclick="clearWhiteboard()">Clear</button>
      <span style="margin-left:auto;font-size:11px;color:var(--text-faint);">Saves automatically to this device</span></div><canvas id="wb-canvas" width="1000" height="520"></canvas></div>`;
  setupWhiteboard();
};
function setWbColor(c){ wbColor=c; renderPage(); }
function setupWhiteboard(){
  const canvas = document.getElementById('wb-canvas'); wbCtx = canvas.getContext('2d'); wbCtx.lineCap='round'; wbCtx.lineJoin='round';
  const saved = load('whiteboard', null);
  if(saved){ const img = new Image(); img.onload = ()=> wbCtx.drawImage(img,0,0); img.src = saved; }
  function pos(e){ const r = canvas.getBoundingClientRect(); const scaleX = canvas.width/r.width, scaleY = canvas.height/r.height; const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left; const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top; return {x:cx*scaleX, y:cy*scaleY}; }
  function start(e){ wbDrawing=true; wbLast=pos(e); e.preventDefault(); }
  function move(e){ if(!wbDrawing) return; const p = pos(e); wbCtx.strokeStyle=wbColor; wbCtx.lineWidth=wbSize; wbCtx.beginPath(); wbCtx.moveTo(wbLast.x, wbLast.y); wbCtx.lineTo(p.x,p.y); wbCtx.stroke(); wbLast = p; e.preventDefault(); }
  function end(){ if(wbDrawing){ wbDrawing=false; save('whiteboard', canvas.toDataURL()); } }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', end);
}
function clearWhiteboard(){ const canvas = document.getElementById('wb-canvas'); wbCtx.clearRect(0,0,canvas.width,canvas.height); save('whiteboard', canvas.toDataURL()); }

let timerState = { mode:'work', remaining:0, running:false, session:0, interval:null };
renderers.timer = function(root){
  const ts = state.timerSettings; if(!timerState.remaining) timerState.remaining = ts.work*60;
  root.innerHTML = `<div class="page-head"><div><p class="page-eyebrow">Life</p><h1 class="page-title">Study Timer</h1><p class="page-desc">Pomodoro-style focus sessions.</p></div></div>
    <div class="card timer-wrap"><div class="timer-ring"><svg width="230" height="230"><circle cx="115" cy="115" r="100" stroke="var(--card)" stroke-width="12" fill="none"/><circle id="timerArc" cx="115" cy="115" r="100" stroke="var(--gold)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="0"/></svg>
      <div class="timer-display"><div class="timer-time" id="timerTime">--:--</div><div class="timer-mode" id="timerMode">Work</div></div></div>
      <div class="timer-controls"><button class="btn btn-primary" id="timerToggle">Start</button><button class="btn" id="timerReset">Reset</button></div>
      <div class="timer-sessions" id="timerSessions"></div>
      <div class="field-row" style="max-width:420px;margin-top:26px;width:100%;"><div class="field"><label>Work (min)</label><input type="number" id="tsWork" value="${ts.work}"></div><div class="field"><label>Short break</label><input type="number" id="tsShort" value="${ts.short}"></div><div class="field"><label>Long break</label><input type="number" id="tsLong" value="${ts.long}"></div></div>
      <button class="btn btn-sm" onclick="saveTimerSettings()">Save timer settings</button></div>`;
  updateTimerDisplay(); document.getElementById('timerToggle').onclick = toggleTimer; document.getElementById('timerReset').onclick = resetTimer; renderSessionDots();
};
function renderSessionDots(){ const el = document.getElementById('timerSessions'); if(!el) return; const total = state.timerSettings.sessions; el.innerHTML = Array.from({length:total}).map((_,i)=>`<div class="sess-dot ${i<timerState.session?'filled':''}"></div>`).join(''); }
function updateTimerDisplay(){
  const t = document.getElementById('timerTime'); if(!t) return; const m = Math.floor(timerState.remaining/60), s = timerState.remaining%60;
  t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('timerMode').textContent = timerState.mode==='work' ? 'Focus' : timerState.mode==='short' ? 'Short break' : 'Long break';
  const totalSecs = (timerState.mode==='work'?state.timerSettings.work:timerState.mode==='short'?state.timerSettings.short:state.timerSettings.long)*60;
  const frac = 1 - (timerState.remaining/totalSecs); const arc = document.getElementById('timerArc'); if(arc) arc.style.strokeDashoffset = 628*(1-frac);
  const btn = document.getElementById('timerToggle'); if(btn) btn.textContent = timerState.running ? 'Pause' : 'Start';
}
function toggleTimer(){
  timerState.running = !timerState.running;
  if(timerState.running){ timerState.interval = setInterval(()=>{ timerState.remaining--; if(timerState.remaining<=0){ nextTimerPhase(); } updateTimerDisplay(); },1000); }
  else { clearInterval(timerState.interval); }
  updateTimerDisplay();
}
function nextTimerPhase(){
  clearInterval(timerState.interval);
  if(timerState.mode==='work'){
    timerState.session++; addXp(15, 'Focus session complete');
    if(timerState.session % state.timerSettings.sessions === 0){ timerState.mode='long'; timerState.remaining=state.timerSettings.long*60; }
    else { timerState.mode='short'; timerState.remaining=state.timerSettings.short*60; }
  } else { timerState.mode='work'; timerState.remaining=state.timerSettings.work*60; }
  renderSessionDots(); timerState.running=false;
}
function resetTimer(){ clearInterval(timerState.interval); timerState.running=false; timerState.mode='work'; timerState.remaining=state.timerSettings.work*60; timerState.session=0; updateTimerDisplay(); renderSessionDots(); }
function saveTimerSettings(){
  state.timerSettings.work = Number(document.getElementById('tsWork').value)||25; state.timerSettings.short = Number(document.getElementById('tsShort').value)||5; state.timerSettings.long = Number(document.getElementById('tsLong').value)||15;
  save('timerSettings', state.timerSettings); resetTimer();
}

let studyGenTime = 30; let studyGenModule = '';
const STUDY_TASKS = {
  15: ['Skim through today\'s lecture slides and jot 3 key takeaways','Rewrite one page of messy notes neatly','Do 5 flashcards or quiz questions','Reply to any outstanding emails from tutors','Tidy your reading list — bin what you won\'t read'],
  30: ['Read one journal article abstract and summarise it in your own words','Do a past-paper question under light time pressure','Rewatch a confusing 10-minute lecture segment and take fresh notes','Draft an outline for your next assignment','Make a set of flashcards for one topic'],
  60: ['Write a full practice essay plan with structure and key evidence','Work through a problem sheet for one module','Read one full journal article and annotate it','Consolidate a week\'s worth of lecture notes into a summary sheet','Do a focused coding practice session on one concept'],
  120: ['Deep-dive one topic you\'re weakest on: read, note, then test yourself','Draft a full section of an assignment from scratch','Work through several past papers back to back','Build or extend a small project related to your course','Do a full revision session: recall, check, redo weak spots']
};
renderers.studygen = function(root){
  root.innerHTml;
  root.innerHTML = `
    <div class="page-head"><div><p class="page-eyebrow">Beyond Uni</p><h1 class="page-title">Random Study Generator</h1><p class="page-desc">Don't know what to work on? Tell it how long you've got.</p></div></div>
    <div class="card">
      <label>Time available</label>
      <div class="timebox" id="timeBox">
        <button data-t="15" class="${studyGenTime==15?'active':''}">15 min</button>
        <button data-t="30" class="${studyGenTime==30?'active':''}">30 min</button>
        <button data-t="60" class="${studyGenTime==60?'active':''}">1 hour</button>
        <button data-t="120" class="${studyGenTime==120?'active':''}">2+ hours</button>
      </div>
      <div class="field"><label>Module or subject (optional)</label><input type="text" id="genModule" value="${studyGenModule}" placeholder="e.g. Organic Chemistry"></div>
      <div class="task-reveal" id="taskReveal">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-faint);font-weight:700;">Suggested task</div>
        <div class="big" id="taskText">Hit generate to get a suggestion.</div>
        <button class="btn btn-primary" onclick="generateStudyTask()">🎲 Generate task</button>
      </div>
    </div>
  `;
  document.getElementById('timeBox').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ studyGenTime = Number(b.dataset.t); renderers.studygen(root); });
};
function generateStudyTask(){
  studyGenModule = document.getElementById('genModule').value.trim();
  const pool = STUDY_TASKS[studyGenTime];

  const text = studyGenModule ? `${pick} — for ${studyGenModule}` : pick;
  document.getElementById('taskText').textContent = text;
  state.studyGenHistory.unshift({id:uid(), text, time:studyGenTime, date:todayISO()});
  save('studyGenHistory', state.studyGenHistory);
  addXp(5, 'Started a study task');
}

  nameEl.oninput = ()=> save('portfolioName', nameEl.textContent);
  document.getElementById('pfRole').textContent = load('portfolioRole', 'Computer Science student — click to edit your headline');
  document.getElementById('pfRole').oninput = (e)=> save('portfolioRole', e.target.textContent);
};
function printPortfolio(){ window.print(); }

/* =========================================================
   INIT
========================================================= */
(function init(){
  loadAll();
  applyTheme();
  renderThemeSelect();
  renderXpBox();
  renderNav();
  renderPage();
  renderSyncStatus();
  updateAuthGate(); // shows the sign-in wall immediately if cloud sync is configured
})();

/* PWA install support */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'flex';
});
function triggerInstall(){
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{
    deferredInstallPrompt = null;
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'none';
  });
}
</script>
